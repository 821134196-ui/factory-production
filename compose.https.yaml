services:
  app:
    ports: !reset []
    environment:
      TRUST_PROXY: 1
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在.env中填写SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?请在.env中填写ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
